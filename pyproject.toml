[project]
name = "tendency-board"
version = "0.1.0"
description = "Next-possession models and a scouting app from public NBA play-by-play"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "pyarrow>=15",
  "lightgbm>=4.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "requests>=2.31",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]   # httpx: FastAPI's test client needs it; tests only
torch = ["torch>=2.2"]     # optional: the experimental transformer (tendency/transformer_net.py), trained in its own process
llm = ["anthropic>=2.14"]  # optional: team summaries under --summaries llm or `summarize`, and the ask box's translator
serve = ["fastapi>=0.110", "uvicorn>=0.29"]   # optional: the ask service (tendency/ask_service.py, `python -m tendency serve`)
bayes = ["pymc>=6"]        # optional: tendency/tendency_pymc.py only. Nothing in the pipeline imports it (DECISIONS.md 99).

[tool.setuptools]
packages = ["tendency", "tendency.stubs"]

[tool.setuptools.package-data]
tendency = ["prompts/*.txt", "ask_questions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

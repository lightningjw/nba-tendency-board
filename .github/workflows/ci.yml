name: CI

on:
  push:
  pull_request:

# One run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        # PyTorch from the CPU-only index (the default Linux wheel carries CUDA and is several times larger).
        # It is an optional extra; installing it here is what lets the transformer's leakage test run in CI.
        # The Anthropic SDK (the llm extra) is installed so the tests can drive it against a local transport. No key, no request leaves CI.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,llm]"
      - name: Tests
        run: pytest
      - name: Synthetic pipeline end to end
        run: python -m tendency sample --root /tmp/synthetic --out /tmp/export
      - name: Contract, Python validator
        run: python -m tendency validate /tmp/export
      - name: Contract, the app's validator
        run: node app/tools/check-contract.mjs /tmp/export
      - name: Bundled sample still matches the contract
        run: |
          python -m tendency validate app/data
          node app/tools/check-contract.mjs app/data
